# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "8-bit SAR ADC"
  team: "Hungry Chippos"
  discord: ""
  description: "8-bit SAR ADC, 833 kS/s @ 10 MHz CLK, GF180MCU (gf180mcuD variant D)"
  lvs_config: "lvs_config.json"

# Pin names match top-level layout text (layer 81/10) exactly.
# Ground pin first (down-bonded quadrant ground), VDD paired next to it.
# Order = clockwise pad placement, bottom-left -> upper-right; VIN kept
# at the far end, away from CLK.
pins:
  - name: VSS
    io_type: ground
  - name: VDD
    io_type: power
  - name: CLK
    io_type: input_schmitt
  - name: RST_N
    io_type: input_cmos
  - name: EOC
    io_type: bidirectional
  - name: BIT_0
    io_type: bidirectional
  - name: BIT_1
    io_type: bidirectional
  - name: BIT_2
    io_type: bidirectional
  - name: BIT_3
    io_type: bidirectional
  - name: BIT_4
    io_type: bidirectional
  - name: BIT_5
    io_type: bidirectional
  - name: BIT_6
    io_type: bidirectional
  - name: BIT_7
    io_type: bidirectional
  - name: VIN
    io_type: analog
    secondary_esd: true
